apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-staging
  namespace: argocd
spec:
  project: default
  sources:
    # 1) Chart from your charts repo (Git)
    - repoURL: https://github.com/priyajithc/sample-system.git
      targetRevision: main
      path: charts/frontend
      helm:
        releaseName: frontend
        valueFiles:
          - $values/apps/frontend/staging/values.yaml   # <- env values from GitOps repo
    # 2) Values-only source from your GitOps repo
    - repoURL: https://github.com/priyajithc/sample-system-ops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
